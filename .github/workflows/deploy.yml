name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/travel-planning-app-Z4Nx6
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /TEST/calendar/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Confines this deploy to its own subdirectory of gh-pages so it
          # can't be clobbered by other projects in this repo (e.g. the
          # ai-assessment-survey branch) that also publish to gh-pages root.
          destination_dir: calendar
