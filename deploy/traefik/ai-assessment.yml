# Traefik 路由片段：assess.rong-rise.com → 本機 Nginx(8090) → 後端(3101)
#
# 本站 Traefik 環境實況：
#   - 跑在 Docker，但使用 host 網路模式 → 可用 localhost 直連主機服務
#   - file provider 為「單一檔案」：/config/dynamic.yml
#     （對應主機路徑 /docker/traefik/config/dynamic.yml）
#   - 憑證 resolver 名稱為 letsencrypt（Cloudflare DNS challenge，已設定）
#
# 因為 file provider 是單一檔案，不能直接丟新檔；請把下面 routers.assess 與
# services.assess-site 兩個區塊「併入」既有的 /docker/traefik/config/dynamic.yml，
# 放在對應的 http.routers / http.services 之下，其餘原有內容保持不變。
# Traefik 已開 providers.file.watch=true，存檔後會自動重新載入並簽發憑證。

http:
  routers:
    assess:
      entrypoints:
        - websecure
      priority: 100
      rule: Host("assess.rong-rise.com")
      service: assess-site
      tls:
        certResolver: letsencrypt

  services:
    assess-site:
      loadBalancer:
        servers:
          - url: http://localhost:8090
