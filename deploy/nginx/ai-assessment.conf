# Nginx 站台設定：提供前端靜態檔，並將 /api 反向代理到 Node 後端。
# 已填入網域 assess.rong-rise.com；先以 HTTP 啟用，再用 certbot --nginx
# 自動補上 443/TLS 與 HTTP→HTTPS 轉址。
#
#   安裝位置：/etc/nginx/sites-available/ai-assessment.conf
#   啟用：    ln -s ../sites-available/ai-assessment.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name assess.rong-rise.com;

    root /var/www/ai-assessment;
    index index.html;

    # gzip（前端 JS/CSS 已可大幅壓縮）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 後端 API 反向代理（保留 /api 前綴）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 帶雜湊檔名的靜態資源可長期快取
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 前端路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
