# Nginx 站台設定（Traefik 共存版）
# 當 VPS 上已有 Traefik 佔用 80/443 時使用本檔：
#   - Nginx 只監聽本機 127.0.0.1:8090（不對外、不處理 TLS）
#   - 由 Traefik 將 assess.rong-rise.com 轉送到 localhost:8090，並負責 HTTPS 憑證
#   （本站 Traefik 為 host 網路模式，故可用 localhost 直連；8080 已被 bot 佔用，改用 8090）
#
#   安裝位置：/etc/nginx/sites-available/ai-assessment.conf
#   啟用：    ln -s ../sites-available/ai-assessment.conf /etc/nginx/sites-enabled/
#   注意：請移除/停用會搶 80 埠的預設站台（/etc/nginx/sites-enabled/default）。

server {
    listen 127.0.0.1:8090;
    server_name assess.rong-rise.com;

    root /var/www/ai-assessment;
    index index.html;

    # gzip（前端 JS/CSS 已可大幅壓縮）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 後端 API 反向代理（保留 /api 前綴）。後端監聽埠為 3101。
    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik 已用 HTTPS 對外，這裡固定回報 https，後端才會發出 Secure cookie
        proxy_set_header X-Forwarded-Proto https;
    }

    # 帶雜湊檔名的靜態資源可長期快取
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 前端路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
