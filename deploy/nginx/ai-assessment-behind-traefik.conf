# Nginx 站台設定（Traefik 共存版）
# 當 VPS 上已有 Traefik 佔用 80/443 時使用本檔：
#   - Nginx 只監聽本機 127.0.0.1:8090（不對外、不處理 TLS）
#   - 由 Traefik 將 assess.rong-rise.com 轉送到 localhost:8090，並負責 HTTPS 憑證
#   （本站 Traefik 為 host 網路模式，故可用 localhost 直連；8080 已被 bot 佔用，改用 8090）
#
#   安裝位置：/etc/nginx/sites-available/ai-assessment.conf
#   啟用：    ln -s ../sites-available/ai-assessment.conf /etc/nginx/sites-enabled/
#   注意：請移除/停用會搶 80 埠的預設站台（/etc/nginx/sites-enabled/default）。

server {
    listen 127.0.0.1:8090;
    # 正式站實況：同一個站台也用 ai.rong-rise.com 這個網域（與 Traefik 的路由一致）。
    server_name assess.rong-rise.com ai.rong-rise.com;

    root /var/www/ai-assessment;
    index index.html;

    # ── 安全標頭 ──────────────────────────────────────────────
    # nginx 的 add_header 只要某個 location 自己有 add_header，就不會繼承 server 層的，
    # 所以下面每個有自己標頭的 location 都要重複一份（Traefik 若已加 HSTS，可移除這行 HSTS）。
    # CSP 先用 Report-Only：瀏覽器只在主控台回報違規、不會擋；上線後用各種功能走一遍
    # （作答、報告列印、QR Code、AI 小幫手、管理後台）確認主控台沒有違規，再把
    # Content-Security-Policy-Report-Only 改成 Content-Security-Policy 正式啟用。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # gzip（前端 JS/CSS 已可大幅壓縮；新版 nginx 把 .js 標成 text/javascript，兩種都要列）
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # 後端 API 反向代理（保留 /api 前綴）。後端監聽埠為 3101。
    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Traefik 已用 HTTPS 對外，這裡固定回報 https，後端才會發出 Secure cookie
        proxy_set_header X-Forwarded-Proto https;
    }

    # 帶雜湊檔名的靜態資源可長期快取
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }

    # 這幾個檔名不帶雜湊：必須每次向伺服器確認有沒有新版，否則部署後舊使用者可能拿到
    # 舊的 index.html 去找已經不存在的 JS 檔（白畫面），或舊的 Service Worker 一直不更新。
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }

    # SPA 前端路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
        # SPA 路由 fallback 回的也是 index.html，同樣要每次確認。
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }
}
